<!DOCTYPE html>
<html>
<head>

    <title>Login / Sign Up - FurniRent</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
        }

        .tabs button {
            width: 50%;
            padding: 12px;
            border: none;
            background: #eee;
            cursor: pointer;
            font-size: 16px;
        }

        .tabs button.active {
            background: #333;
            color: white;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .main-btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .main-btn:hover {
            background: #555;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #333;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>FurniRent</h1>

    <div class="tabs">

        <button
            id="loginTab"
            class="active"
            onclick="showLogin()">
            Login
        </button>

        <button
            id="signupTab"
            onclick="showSignup()">
            Sign Up
        </button>

    </div>


    <!-- LOGIN FORM -->

    <div id="loginForm" class="form active">

        <input
            type="email"
            id="loginEmail"
            placeholder="Email">

        <input
            type="password"
            id="loginPassword"
            placeholder="Password">

        <button
            class="main-btn"
            onclick="login()">
            Login
        </button>

    </div>


    <!-- SIGNUP FORM -->

    <div id="signupForm" class="form">

        <input
            type="text"
            id="signupName"
            placeholder="Full Name">

        <input
            type="email"
            id="signupEmail"
            placeholder="Email">

        <input
            type="text"
            id="signupPhone"
            placeholder="Phone Number">

        <input
            type="text"
            id="signupAddress"
            placeholder="Address">

        <input
            type="password"
            id="signupPassword"
            placeholder="Password">

        <button
            class="main-btn"
            onclick="signup()">
            Create Account
        </button>

    </div>


    <div id="message"></div>


    <div class="back">
        <a href="index.html">← Back to Home</a>
    </div>

</div>


<script>


// SHOW LOGIN

function showLogin() {

    document.getElementById("loginForm")
        .classList.add("active");

    document.getElementById("signupForm")
        .classList.remove("active");

    document.getElementById("loginTab")
        .classList.add("active");

    document.getElementById("signupTab")
        .classList.remove("active");

}


// SHOW SIGNUP

function showSignup() {

    document.getElementById("signupForm")
        .classList.add("active");

    document.getElementById("loginForm")
        .classList.remove("active");

    document.getElementById("signupTab")
        .classList.add("active");

    document.getElementById("loginTab")
        .classList.remove("active");

}


// SIGNUP

async function signup() {

    const name =
        document.getElementById("signupName").value;

    const email =
        document.getElementById("signupEmail").value;

    const phone =
        document.getElementById("signupPhone").value;

    const address =
        document.getElementById("signupAddress").value;

    const password =
        document.getElementById("signupPassword").value;


    const message =
        document.getElementById("message");


    try {

        const response = await fetch("/api/signup", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name,
                email,
                phone,
                address,
                password
            })

        });


        const result =
            await response.json();


        if (response.ok) {

            message.style.color = "green";

            message.innerHTML =
                "Account created successfully!";

            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 1000);

        } else {

            message.style.color = "red";

            message.innerHTML =
                result.message;

        }


    } catch (error) {

        message.style.color = "red";

        message.innerHTML =
            "Unable to connect to server.";

    }

}


// LOGIN

async function login() {

    const email =
        document.getElementById("loginEmail").value;

    const password =
        document.getElementById("loginPassword").value;


    const message =
        document.getElementById("message");


    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email,
                password
            })

        });


        const result =
            await response.json();


        if (response.ok) {

            message.style.color = "green";

            message.innerHTML =
                "Login successful!";


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 1000);

        } else {

            message.style.color = "red";

            message.innerHTML =
                result.message;

        }


    } catch (error) {

        message.style.color = "red";

        message.innerHTML =
            "Unable to connect to server.";

    }

}

</script>

</body>
</html>
